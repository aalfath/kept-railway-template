# Local test only (Daytona): the Railway stack with MinIO standing in for the Railway Bucket.
name: her-3084
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret-test-only
      POSTGRES_DB: kept
    volumes: [pg:/var/lib/postgresql]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment: {MINIO_ROOT_USER: testkey, MINIO_ROOT_PASSWORD: testsecret123}
  mkbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["sh","-c","until mc alias set m http://minio:9000 testkey testsecret123; do sleep 1; done; mc mb -p m/kept"]
  kept:
    build: ..
    mem_limit: 512m
    cpus: 1
    depends_on: [postgres, mkbucket]
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      KEPT_PUBLIC_URL: http://localhost:8080
      KEPT_DB_HOST: postgres
      KEPT_DB_SUPERUSER_PASSWORD: supersecret-test-only
      KEPT_DB_OWNER_PASSWORD: 1111111111111111111111111111111111111111111111111111111111111111
      KEPT_DB_APP_PASSWORD: 2222222222222222222222222222222222222222222222222222222222222222
      KEPT_DB_AUTH_PASSWORD: 3333333333333333333333333333333333333333333333333333333333333333
      KEPT_DB_SYSTEM_PASSWORD: 4444444444444444444444444444444444444444444444444444444444444444
      KEPT_SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      KEPT_AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      KEPT_SETUP_CODE: ABC234
      KEPT_STORAGE: s3
      KEPT_S3_ENDPOINT: http://minio:9000
      KEPT_S3_BUCKET: kept
      KEPT_S3_REGION: us-east-1
      KEPT_S3_ACCESS_KEY_ID: testkey
      KEPT_S3_SECRET_ACCESS_KEY: testsecret123
      KEPT_S3_FORCE_PATH_STYLE: "true"
      KEPT_LOG_FORMAT: json
volumes: {pg: {}}
